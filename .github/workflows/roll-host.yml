name: Roll host

# The one way containers reach the EC2 host. deploy.yml calls it after the
# images are built and the schema is pushed; rollback.yml calls it with the
# digests of an older version (ADR-0021). Both pass every repository secret
# with `secrets: inherit`, so the env file written below is the same list for
# a forward deploy and a rollback, and cannot drift between the two.

on:
  workflow_call:
    inputs:
      website_digest:
        description: sha256 digest of the website image to run
        required: true
        type: string
      nginx_digest:
        description: sha256 digest of the nginx image to run
        required: true
        type: string
      files_ref:
        description: >-
          Commit whose compose files, observability configs, and remote deploy
          script go to the host. The forward deploy passes the commit it
          built; the rollback passes the target version's deployed commit.
        required: true
        type: string
      rollback_run:
        description: >-
          true for a rollback. The remote script then leaves the containers
          as they are when the health check fails instead of re-pulling the
          digests it found on the host, which would be the version being
          rolled back from. After the health check passes, `latest` in GHCR
          is moved to the rolled digests so the next rollback steps back one
          more version.
        required: false
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io

jobs:
  roll:
    name: Deploy to EC2 via SSH with temporary IP allow
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      WEBSITE_IMAGE: ghcr.io/${{ github.repository_owner }}/boudreaux/website
      NGINX_IMAGE: ghcr.io/${{ github.repository_owner }}/boudreaux/nginx
      # Align secret names: ensure AWS_SECURITY_GROUP_ID exists in repo secrets
      AWS_SECURITY_GROUP_ID: ${{ secrets.AWS_SECURITY_GROUP_ID }}
      # Toggle: set to 'true' to fail deploy if self-signed cert remains after issuance attempts
      REQUIRE_TRUSTED_CERT: ${{ vars.REQUIRE_TRUSTED_CERT || 'false' }}
      WEBSITE_DIGEST: ${{ inputs.website_digest }}
      NGINX_DIGEST: ${{ inputs.nginx_digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.files_ref }}

      - name: Validate image digests
        run: |
          echo "Will deploy with digests:"
          echo "  Website: $WEBSITE_DIGEST"
          echo "  Nginx: $NGINX_DIGEST"
          echo "  Host files from: ${{ inputs.files_ref }}"
          echo "  Rollback run: ${{ inputs.rollback_run }}"

          if [ -z "$WEBSITE_DIGEST" ] || [ "$WEBSITE_DIGEST" = "null" ]; then
            echo "ERROR: Missing website image digest"
            exit 1
          fi
          if [ -z "$NGINX_DIGEST" ] || [ "$NGINX_DIGEST" = "null" ]; then
            echo "ERROR: Missing nginx image digest"
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Ensure Security Groups allow HTTP/HTTPS on all attached SGs
        env:
          AWS_SECURITY_GROUP_ID: ${{ env.AWS_SECURITY_GROUP_ID }}
        run: bash scripts/ci/ensure-security-groups.sh

      - name: Get runner public IP
        id: ip
        run: echo "ipv4=$(curl -sf https://api.ipify.org)" >> "$GITHUB_OUTPUT"

      - name: Temporarily whitelist runner IP for SSH on all Security Groups
        env:
          AWS_SECURITY_GROUP_ID: ${{ env.AWS_SECURITY_GROUP_ID }}
        run: bash scripts/ci/whitelist-runner-ip.sh "${{ steps.ip.outputs.ipv4 }}"

      - name: Create .env for remote
        env:
          # Handled separately below so their value is normalized to a single
          # line — see the newline-stripping block after the heredoc.
          CLOUDFRONT_PRIVATE_KEY_BASE64: ${{ secrets.CLOUDFRONT_PRIVATE_KEY_BASE64 }}
          APPLE_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_PRIVATE_KEY_BASE64 }}
        run: |
          cat > .env.deploy << 'EOF'
          NEXT_APP_WEBSITE_IMAGE=${{ env.WEBSITE_IMAGE }}
          NEXT_APP_NGINX_IMAGE=${{ env.NGINX_IMAGE }}
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          AUTH_SECRET=${{ secrets.AUTH_SECRET }}
          AUTH_URL=${{ secrets.AUTH_URL }}
          GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
          FACEBOOK_CLIENT_ID=${{ secrets.FACEBOOK_CLIENT_ID }}
          FACEBOOK_CLIENT_SECRET=${{ secrets.FACEBOOK_CLIENT_SECRET }}
          TWITTER_CLIENT_ID=${{ secrets.TWITTER_CLIENT_ID }}
          TWITTER_CLIENT_SECRET=${{ secrets.TWITTER_CLIENT_SECRET }}
          APPLE_CLIENT_ID=${{ secrets.APPLE_CLIENT_ID }}
          APPLE_CLIENT_SECRET=${{ secrets.APPLE_CLIENT_SECRET }}
          APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}
          APPLE_KEY_ID=${{ secrets.APPLE_KEY_ID }}
          APPLE_APP_BUNDLE_IDENTIFIER=${{ secrets.APPLE_APP_BUNDLE_IDENTIFIER }}
          EMAIL_SERVER_HOST=${{ secrets.EMAIL_SERVER_HOST }}
          EMAIL_SERVER_PORT=${{ secrets.EMAIL_SERVER_PORT }}
          EMAIL_SERVER_USER=${{ secrets.EMAIL_SERVER_USER }}
          EMAIL_SERVER_PASSWORD=${{ secrets.EMAIL_SERVER_PASSWORD }}
          EMAIL_FROM=${{ secrets.EMAIL_FROM }}
          NEXT_PUBLIC_CLOUDFLARE_SITE_KEY=${{ secrets.NEXT_PUBLIC_CLOUDFLARE_SITE_KEY }}
          CLOUDFLARE_SECRET=${{ secrets.CLOUDFLARE_SECRET }}
          AWS_REGION=${{ secrets.AWS_REGION }}
          AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_S3_BUCKET_NAME=${{ secrets.AWS_S3_BUCKET_NAME }}
          S3_BUCKET=${{ secrets.S3_BUCKET }}
          CDN_DOMAIN=${{ secrets.CDN_DOMAIN }}
          NEXT_PUBLIC_CDN_DOMAIN=${{ secrets.NEXT_PUBLIC_CDN_DOMAIN }}
          CLOUDFRONT_KEY_PAIR_ID=${{ secrets.CLOUDFRONT_KEY_PAIR_ID }}
          NEXT_PUBLIC_HOST_NAME=${{ secrets.NEXT_PUBLIC_HOST_NAME }}
          NEXT_PUBLIC_BASE_URL=${{ secrets.NEXT_PUBLIC_BASE_URL }}
          STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }}
          NEXT_PUBLIC_STRIPE_PRICE_MINIMUM=${{ secrets.NEXT_PUBLIC_STRIPE_PRICE_MINIMUM }}
          NEXT_PUBLIC_STRIPE_PRICE_EXTRA=${{ secrets.NEXT_PUBLIC_STRIPE_PRICE_EXTRA }}
          NEXT_PUBLIC_STRIPE_PRICE_EXTRA_EXTRA=${{ secrets.NEXT_PUBLIC_STRIPE_PRICE_EXTRA_EXTRA }}
          PUSHER_APP_ID=${{ secrets.PUSHER_APP_ID }}
          PUSHER_KEY=${{ secrets.PUSHER_KEY }}
          PUSHER_SECRET=${{ secrets.PUSHER_SECRET }}
          PUSHER_CLUSTER=${{ secrets.PUSHER_CLUSTER }}
          NEXT_PUBLIC_PUSHER_KEY=${{ secrets.NEXT_PUBLIC_PUSHER_KEY }}
          NEXT_PUBLIC_PUSHER_CLUSTER=${{ secrets.NEXT_PUBLIC_PUSHER_CLUSTER }}
          UPSTASH_REDIS_REST_URL=${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN=${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          BIO_GENERATOR_LAMBDA_NAME=${{ vars.BIO_GENERATOR_LAMBDA_NAME || 'fakefour-bio-generator' }}
          JOB_CALLBACK_SECRET=${{ secrets.JOB_CALLBACK_SECRET }}
          GRAFANA_ADMIN_PASSWORD=${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          GRAFANA_ALERT_EMAIL=${{ secrets.GRAFANA_ALERT_EMAIL }}
          LOG_LEVEL=${{ vars.LOG_LEVEL || 'info' }}
          SMS_PROVIDER=${{ vars.SMS_PROVIDER || 'noop' }}
          SNS_SMS_ORIGINATION_NUMBER=${{ vars.SNS_SMS_ORIGINATION_NUMBER }}
          EOF

          # Base64-encoded private keys can be stored line-wrapped (multi-line):
          # `base64` wraps at 76 columns, `openssl base64` at 64. Compose's
          # env-file parser reads only the FIRST line of an unquoted value, so a
          # wrapped key reaches the container truncated (the CloudFront signing
          # incident: a header-only PEM that fails to parse). Collapse each to a
          # single line so the whole value survives regardless of how it was
          # encoded. `tr -d '\r\n'` on an already-single-line value is a no-op.
          {
            printf 'CLOUDFRONT_PRIVATE_KEY_BASE64=%s\n' "$(printf '%s' "$CLOUDFRONT_PRIVATE_KEY_BASE64" | tr -d '\r\n')"
            printf 'APPLE_PRIVATE_KEY_BASE64=%s\n' "$(printf '%s' "$APPLE_PRIVATE_KEY_BASE64" | tr -d '\r\n')"
          } >> .env.deploy

      # One transfer instead of three: each scp-action opens its own SSH
      # session, and the host roll is on the rollback's two-minute path.
      # The deploy script lands at ~/boudreaux/deploy-remote.sh via the
      # strip, as before; the rest keep their paths.
      - name: Upload compose, env, observability and deploy script
        uses: appleboy/scp-action@v1.0.0
        with:
          # Align secret names: EC2_HOST, EC2_USERNAME, SSH_PRIVATE_KEY
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: docker-compose.prod.yml,docker-compose.logging.yml,.env.deploy,observability,scripts/ci/deploy-remote.sh
          target: ~/boudreaux

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        env:
          LETSENCRYPT_EMAIL: ${{ secrets.LETSENCRYPT_EMAIL }}
          # Use the workflow's short-lived GITHUB_TOKEN (granted packages above)
          # so we don't depend on a long-lived GHCR_TOKEN PAT for EC2 pulls.
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USERNAME: ${{ github.actor }}
          ROLLBACK_RUN: ${{ inputs.rollback_run }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 60s
          command_timeout: 30m
          envs: WEBSITE_IMAGE,NGINX_IMAGE,WEBSITE_DIGEST,NGINX_DIGEST,REQUIRE_TRUSTED_CERT,LETSENCRYPT_EMAIL,GHCR_TOKEN,GHCR_USERNAME,ROLLBACK_RUN
          script: |
            mv -f ~/boudreaux/scripts/ci/deploy-remote.sh ~/boudreaux/deploy-remote.sh
            rm -rf ~/boudreaux/scripts
            chmod +x ~/boudreaux/deploy-remote.sh
            ~/boudreaux/deploy-remote.sh

      - name: Revoke runner IP from all Security Groups
        if: always()
        env:
          AWS_SECURITY_GROUP_ID: ${{ env.AWS_SECURITY_GROUP_ID }}
        run: bash scripts/ci/revoke-runner-ip.sh "${{ steps.ip.outputs.ipv4 }}"

      # The remote script already waited for the containers and curled the
      # health endpoint once; this one retries with backoff and checks the
      # JSON body, so no fixed sleep is needed in front of it.
      - name: Verify application health
        env:
          HEALTH_URL: https://fakefourrecords.com/api/health
        run: bash scripts/ci/verify-health.sh

      - name: Log in to container registry
        if: ${{ inputs.rollback_run }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `latest` means "live". The forward deploy moves it at build time; a
      # rollback moves it here, after the health check, so rollback-resolve.sh
      # reads the rolled version as live and the next rollback steps back
      # one more version (ADR-0021).
      - name: Point latest at the rolled images
        if: ${{ inputs.rollback_run }}
        run: |
          set -e
          docker buildx imagetools create -t "${WEBSITE_IMAGE}:latest" "${WEBSITE_IMAGE}@${WEBSITE_DIGEST}"
          docker buildx imagetools create -t "${NGINX_IMAGE}:latest" "${NGINX_IMAGE}@${NGINX_DIGEST}"
          echo "latest now points at the rolled digests"
