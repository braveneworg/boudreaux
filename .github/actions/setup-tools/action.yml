name: 'Setup pnpm + Node.js'
description: 'Install pnpm and Node.js only — no dependency install. Use when you do not need node_modules (e.g. version-bump jobs).'

runs:
  using: 'composite'
  steps:
    # Node and pnpm versions both come from mise.toml — the single source of
    # truth for the toolchain. Do not pin either version here; a second pin
    # drifts from mise.toml and silently installs the wrong toolchain.
    - name: Install Node.js + pnpm via mise
      uses: jdx/mise-action@v4

    - name: Resolve pnpm store path
      id: pnpm-store
      shell: bash
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

    # Replaces actions/setup-node's `cache: pnpm`, which is unavailable now
    # that mise installs Node.
    - name: Cache pnpm store
      uses: actions/cache@v4
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: ${{ runner.os }}-pnpm-store-
