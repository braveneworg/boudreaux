name: 'Start MongoDB replica set'
description: >-
  Starts a single-node mongo:7 replica set on localhost:27018 (container
  mongo-e2e) — the same database the E2E suite and the db-contract specs run
  against. Pulls with retries, waits for mongod, initiates rs0, waits for a
  primary.

runs:
  using: 'composite'
  steps:
    - name: Start MongoDB replica set
      shell: bash
      run: |
        # Pull the image up front with retries. GitHub-hosted runners share
        # IPs that intermittently time out or hit anonymous-pull rate limits
        # against Docker Hub ("context deadline exceeded"); a few retries
        # make the pull resilient without needing registry credentials.
        for i in $(seq 1 5); do
          if docker pull mongo:7; then
            echo "Pulled mongo:7"
            break
          fi
          if [ "$i" = "5" ]; then
            echo "docker pull mongo:7 failed after 5 attempts" >&2
            exit 1
          fi
          echo "docker pull failed (attempt $i/5); retrying in 15s..."
          sleep 15
        done

        docker run -d --name mongo-e2e \
          -p 27018:27018 \
          -e MONGO_INITDB_DATABASE=boudreaux-e2e \
          mongo:7 mongod --replSet rs0 --bind_ip_all --port 27018

        # Wait for mongod to accept connections
        for i in $(seq 1 30); do
          if docker exec mongo-e2e mongosh --port 27018 --eval "db.runCommand({ping:1})" 2>/dev/null; then
            echo "MongoDB is ready"
            break
          fi
          echo "Waiting for MongoDB... ($i/30)"
          sleep 2
        done

        # Initiate replica set (ignore "already initialized" errors)
        docker exec mongo-e2e mongosh --port 27018 --eval "
          try { rs.initiate({_id:'rs0', members:[{_id:0, host:'localhost:27018'}]}) }
          catch(e) { if (e.codeName !== 'AlreadyInitialized') throw e; }
        "

        # Wait for primary election
        for i in $(seq 1 15); do
          PRIMARY=$(docker exec mongo-e2e mongosh --port 27018 --quiet --eval "rs.isMaster().ismaster" 2>/dev/null || echo "false")
          if [ "$PRIMARY" = "true" ]; then
            echo "Replica set primary elected"
            break
          fi
          echo "Waiting for primary election... ($i/15)"
          sleep 2
        done
